name: Build StageArt Theme

on:
  push:
    branches: [main]
    paths:
      - 'theme/stageart/**'
      - '.github/workflows/build-stageart-theme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP syntax check
        run: |
          find theme/stageart -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate theme package
        run: |
          test -f theme/stageart/style.css
          test -f theme/stageart/functions.php
          test -f theme/stageart/index.php

      - name: Build theme ZIP
        run: |
          cd theme
          zip -r ../stageart-theme.zip stageart

      - name: Verify theme ZIP
        run: |
          unzip -l stageart-theme.zip | grep -E 'stageart/style.css|stageart/functions.php'

      - name: Upload theme artifact
        uses: actions/upload-artifact@v4
        with:
          name: StageArtTheme
          path: stageart-theme.zip
          if-no-files-found: error
          retention-days: 90
